[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "hausa-ecosystem"
version = "0.2.0"
requires-python = ">=3.10"

[project.scripts]
hausa = "hausa_ecosystem.cli:main"
hausa-check = "hausa_ecosystem.check_cli:main"

[tool.setuptools.packages.find]
include = ["core", "hausa_ecosystem"]
